<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <img id="cimg" src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=400&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OHx8bW91bnRhaW58ZW58MHx8MHx8fDA%3D" alt="" >
        <br><br>
        <button onclick="image()">Change image</button>
    </div>
    <script>
        function image(){
            document.getElementById("cimg").src="https://plus.unsplash.com/premium_photo-1664300792059-863ccfe55932?w=400&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8Zm9yZXN0fGVufDB8fDB8fHww";
        }

        let btn = document.querySelector("button");
        btn.style.padding="16px 30px";
        btn.style.backgroundColor="black";
        btn.style.color="white";
        btn.style.cursor="pointer";
        
    </script>

</body>
</html>
